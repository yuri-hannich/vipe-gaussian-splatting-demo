[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vipe-gaussian-splatting-demo"
version = "0.1.0"
description = "Reproducible ViPE to Gaussian Splatting reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yurii Hannich" }]
dependencies = []

[project.scripts]
vipe-demo = "vipe_demo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vipe_demo"]
