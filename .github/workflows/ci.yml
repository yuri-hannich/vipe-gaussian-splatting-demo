name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.12.11"
          args: "check src tests"
      - name: Verify repository contracts
        run: make verify
